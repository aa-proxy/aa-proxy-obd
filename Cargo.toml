[package]
name = "aa-proxy-obd"
authors = ['Mariusz Białończyk', 'Richard M']
version = "0.2.0"
edition = "2021"
license = 'GPL-2.0'
description = 'EV OBD-II telemetry logger'
documentation = 'https://github.com/aa-proxy/aa-proxy-obd'
readme = 'README.md'
include = ['/README.md', '/LICENSE', '/Cargo.toml', '/Cargo.lock', '/src/*.rs', '/src/**/*.rs', 'images/*']
keywords = ['canze', 'can', 'renault', 'zoe', 'ze', 'ev', 'obd', 'ioniq', 'ev6', 'mg4', 'niro', 'kia', 'hyundai', 'aa-proxy-rs']
categories = ['command-line-utilities']
homepage = 'https://github.com/aa-proxy/aa-proxy-obd'
repository = 'https://github.com/aa-proxy/aa-proxy-obd'

[dependencies]
log = "0.4"
fern = "0.7"
paris = "1.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ctrlc = { version = "3.4", features = ["termination"] }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.36", features = ["full"] }
tokio-serial = "5.4"
# Bluetooth stack. bluer pulls in dbus -> libdbus-sys (FFI bindings to the C
# libdbus). libdbus-sys is declared here despite never being imported directly:
# Cargo feature unification then enables its `vendored` feature on the same crate
# instance bluer uses. Vendored compiles libdbus from source and links it
# statically, which is required when cross-compiling (e.g. aarch64) where
# pkg-config cannot locate a target libdbus and the build otherwise fails with
# "failed to run custom build command for libdbus-sys".
#
# bluer and dbus are pinned exactly so a `cargo update` cannot move libdbus-sys
# onto a version that bluer's copy resolves separately, which would silently drop
# the vendored feature. The committed Cargo.lock is the primary guarantee; these
# pins are defence-in-depth.
bluer = { version = "=0.17.4", features = ["full"] }
dbus = "=0.9.11"
libdbus-sys = { version = "0.2.7", features = ["vendored"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.22"
anyhow = "1.0"
async-trait = "0.1"
futures-util = "0.3"

[dev-dependencies]
wiremock = "0.6"
